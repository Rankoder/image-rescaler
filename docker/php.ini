; Errors go to the container log (docker compose logs web), never into HTTP responses
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Do not advertise the PHP version in the X-Powered-By header
expose_php = Off

; Stack traces in the log name functions and lines but not argument values, which may hold secrets
; (AppConfig is built with the S3 key and the Dropbox token)
zend.exception_ignore_args = On

; The contract allows files up to 5 MB; a larger one arrives as UPLOAD_ERR_INI_SIZE and is answered with 422.
; A whole request over post_max_size reaches the app with an empty body, which ImageController recognises.
upload_max_filesize = 5M
post_max_size = 16M

; GD holds a decoded image as 4 bytes per pixel: a 5000 × 5000 source, the largest the contract allows,
; peaks at about 175 MB for PNG and 100 MB for JPEG and WebP, above the default 128M.
memory_limit = 256M
