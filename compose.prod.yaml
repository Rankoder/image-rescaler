name: image-rescaler-prod

services:
  web:
    build:
      context: .
      target: prod
    ports:
      # Host port from APP_PORT in .env, as in compose.yaml
      - "${APP_PORT:-8080}:8080"
    env_file: .env
    volumes:
      - storage:/var/www/html/storage
      # The app reads its settings from the environment (env_file above), not from this file
      - ./.env:/var/www/html/.env:ro
    restart: unless-stopped

volumes:
  storage:
