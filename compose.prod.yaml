name: image-rescaler-prod

services:
  web:
    build:
      context: .
      target: prod
    ports:
      # Host port from APP_PORT in .env, as in compose.yaml
      - "${APP_PORT:-8080}:8080"
    env_file: .env
    volumes:
      - storage:/var/www/html/storage
      # ImageController loads the .env file on every request and fails without it
      - ./.env:/var/www/html/.env:ro
    restart: unless-stopped

volumes:
  storage:
