name: CI

# Every push, on any branch; a PR shows the result of its latest commit
on: push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --no-progress

      # Tests take their environment from phpunit.xml; no .env file is needed
      - run: composer check

  prod-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # compose.prod.yaml reads settings from .env and mounts it; the example file is enough to start
      - run: cp .env-example .env

      - run: docker compose -f compose.prod.yaml up --build -d --wait --wait-timeout 120

      - run: curl --fail --silent http://localhost:8080/health

      - if: failure()
        run: docker compose -f compose.prod.yaml logs web
