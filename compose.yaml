services:
  web:
    build:
      context: .
      target: dev
    # Xdebug connects back to the IDE on the host; Docker Desktop resolves this name itself, Linux needs the mapping
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host port; a second copy of the project next to this one sets another APP_PORT in its .env
      - "${APP_PORT:-8080}:8080"
    volumes:
      - .:/var/www/html
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - DROPBOX_ACCESS_TOKEN=${DROPBOX_ACCESS_TOKEN}
      # LocalStorageService builds the returned url from it
      - APP_PORT=${APP_PORT:-8080}
